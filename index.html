<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My タイマー</title>
    <meta name="description" content="日本標準時（JST）表示とカウントダウン機能付きのシンプルなタイマー。Windows にインストールしてウィジェットから起動できます。">
    <meta name="theme-color" content="#062b45">
    <!-- PWA マニフェスト（Windows へのインストール／ウィジェット登録に必要） -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <!-- iPhoneホーム画面用アイコン -->
    <link rel="apple-touch-icon" href="icon.png">
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="512x512" href="icon.png">
</head>
<body>
    <div class="bubbles" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>
    <!-- コンパクト表示中だけ出る「元のサイズに戻す」ボタン -->
    <button id="expand-btn" type="button" title="元のサイズに戻す">⤢</button>
    <div class="container">
        <h1>My タイマー</h1>
        <div class="version">ver 1.0.0</div>
        <div id="jst-time">日本標準時: <span id="current-time"></span></div>
        <div class="timer">
                    </div>
                <div id="countdown-timer">
                        <div id="earphone-mode-area">
                            <label class="toggle-switch">
                                <input type="checkbox" id="earphone-mode-toggle">
                                <span class="toggle-slider"></span>
                            </label>
                            <span id="earphone-mode-label">🔇 スピーカーOFF（振動のみ）</span>
                        </div>
                        <div id="sound-btn-area" style="display:none; margin: 16px 0;">
                            <button id="play-sound-btn">アラームを止める</button>
                        </div>

                    <div id="preset-buttons"></div>
                    <div id="custom-input-row">
                        <input type="number" id="custom-minutes" min="0" placeholder="分" style="width:60px;">
                        <input type="number" id="custom-seconds" min="0" max="59" placeholder="秒" style="width:60px;">
                        <button onclick="setCustomCountdown()">セット</button>
                        <button id="add-preset-btn" type="button">＋ プリセットに追加</button>
                    </div>
                    <div id="preset-tools">
                        <button id="preset-edit-toggle" type="button">✏️ プリセットを編集</button>
                        <button id="preset-reset" type="button" style="display:none;">初期値に戻す</button>
                    </div>
                    <div id="preset-message"></div>
                    <div id="countdown-display" style="font-size:2em; margin:10px 0;">00:00.000</div>
                    <div id="control-row">
                        <button onclick="startCountdown()">スタート</button>
                        <button onclick="stopCountdown()">ストップ</button>
                        <button onclick="resetCountdown()">リセット</button>
                    </div>
                    <div id="compact-toggle-area">
                        <button id="compact-btn" type="button">🔳 コンパクト表示にする</button>
                    </div>
                    <div id="wakelock-status" style="font-size:0.82em; margin-top:10px;"></div>
                </div>
                <div class="buttons">
                        <!-- ストップウォッチ用ボタン削除 -->
                </div>
    </div>
    <script src="script.js"></script>
    <script>
        // Service Worker 登録（PWA インストールとウィジェットの前提条件）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((e) => {
                    console.warn('Service Worker 登録に失敗:', e);
                });
            });
        }
    </script>
</body>
</html>
